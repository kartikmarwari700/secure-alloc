# SecureAlloc server settings   (use:  ./server --config secure_alloc.conf)
tcp_port        = 5000      # requests / grants (encrypted)
udp_port        = 5001      # heartbeat + status
hb_timeout      = 6         # seconds of silence before a client is dropped
status_interval = 5         # seconds between UDP status broadcasts
max_clients     = 32
log_file        = logs/server.log

# shared resources: name and number of units
resource R1 1
resource R2 1
resource R3 3
